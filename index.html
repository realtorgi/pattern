<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seattle English Academy - 고등 영어 모의고사 누적 오답 분석 포털</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f3ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#1e1b4b', 950: '#0f0e26' },
                        navy: { 800: '#1b1d36', 900: '#131427', 950: '#0b0c19' }
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #0b0c19; color: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333660; border-radius: 4px; }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(225, 29, 72, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
        }
        .recording-active { animation: pulse-ring 1.5s infinite; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const defaultAppId = 'seattle-english-app';
        const firebaseConfig = {
            apiKey: "AIzaSyAWDVumJr03-BKDDrGwr5qVhjwav3j6Ov0",
            authDomain: "sea-patten.firebaseapp.com",
            projectId: "sea-patten",
            storageBucket: "sea-patten.firebasestorage.app",
            messagingSenderId: "417786307737",
            appId: "1:417786307737:web:dabf32b578e4e0f59e0408"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        function updateBadge(status, text) {
            const badge = document.getElementById('cloud-status-badge');
            if (!badge) return;
            if (status === 'connected') {
                badge.innerHTML = `<i class="fa-solid fa-cloud-check text-emerald-400"></i> <span class="text-emerald-300">${text}</span>`;
            } else if (status === 'syncing') {
                badge.innerHTML = `<i class="fa-solid fa-arrows-rotate fa-spin text-indigo-400"></i> <span class="text-indigo-300">${text}</span>`;
            } else {
                badge.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-400"></i> <span class="text-amber-300">${text}</span>`;
            }
        }

        window.FB_SERVICE = {
            db: db, auth: auth, appId: defaultAppId,
            async saveStudentToCloud(studentObj) {
                try {
                    const docRef = doc(db, 'artifacts', defaultAppId, 'public', 'data', 'students', String(studentObj.id));
                    await setDoc(docRef, studentObj, { merge: true });
                } catch (e) { console.error(e); }
            },
            async deleteStudentFromCloud(docId) {
                try {
                    await deleteDoc(doc(db, 'artifacts', defaultAppId, 'public', 'data', 'students', String(docId)));
                } catch (e) {}
            }
        };

        async function initAuth() {
            try { await signInAnonymously(auth); } catch (e) { subscribeToStudentCollection(); }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) { subscribeToStudentCollection(); } else { initAuth(); }
        });

        function subscribeToStudentCollection() {
            const colRef = collection(db, 'artifacts', defaultAppId, 'public', 'data', 'students');
            onSnapshot(colRef, (snapshot) => {
                const cloudData = [];
                snapshot.forEach((docSnap) => { cloudData.push(docSnap.data()); });

                if (cloudData.length > 0) {
                    window.studentData = cloudData.sort((a, b) => (b.id || 0) - (a.id || 0));
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(window.studentData));
                } else if (window.studentData && window.studentData.length > 0) {
                    window.studentData.forEach(s => window.FB_SERVICE.saveStudentToCloud(s));
                }

                updateBadge('connected', `클라우드 동기화 완료 (${window.studentData.length}명)`);
                if (window.currentSystemMode === 'teacher') {
                    window.renderTeacherDashboard();
                }
            }, (error) => {
                updateBadge('error', `클라우드 연결 오류`);
            });
        }
    </script>
</head>
<body class="min-h-screen flex flex-col transition-colors duration-300">
    <header class="bg-navy-900 border-b border-indigo-900/40 text-white sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-indigo-400 flex items-center justify-center shadow-lg text-white text-xl">
                    <i class="fa-solid fa-school-flag"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight text-white">Seattle English Academy</h1>
                    <p class="text-[11px] text-indigo-300/80">고등 영어 모의고사 누적 오답 분석 & 1:1 전략 지도 포털</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <div class="bg-navy-950 p-1 rounded-2xl border border-indigo-900/80 flex items-center space-x-1">
                    <button onclick="switchMode('student')" id="btn-mode-student" class="px-3 py-1.5 rounded-xl text-xs font-bold transition bg-indigo-600 text-white shadow-md flex items-center gap-1.5"><i class="fa-solid fa-user-graduate"></i> 학생 모드</button>
                    <button onclick="switchMode('teacher')" id="btn-mode-teacher" class="px-3 py-1.5 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white flex items-center gap-1.5"><i class="fa-solid fa-chalkboard-user text-purple-400"></i> 선생님 모드</button>
                </div>
                <a href="tel:010-8921-7812" class="hidden sm:flex items-center space-x-2 text-rose-400 hover:text-rose-300 transition text-sm font-bold bg-navy-800/80 px-3 py-1.5 rounded-xl border border-rose-500/20">
                    <i class="fa-solid fa-phone"></i>
                    <span>원장 지남 <span class="text-white font-normal ml-1">010-8921-7812</span></span>
                </a>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
        <!-- VIEW 1: STUDENT VIEW -->
        <div id="view-student-portal" class="space-y-6 hidden">
            <div id="checkin-card" class="max-w-2xl mx-auto bg-navy-900/90 rounded-3xl border border-indigo-900/60 p-6 sm:p-8 shadow-2xl">
                <h2 class="text-xl font-black text-white mb-2"><i class="fa-solid fa-chart-line text-indigo-400"></i> 학생 성적 분석과 대비책</h2>
                <form onsubmit="handleStudentCheckin(event)" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <select id="checkin-grade" required class="w-full px-4 py-3 text-sm bg-navy-950 border border-indigo-800 rounded-2xl text-slate-100">
                            <option value="">-- 학년 선택 --</option>
                            <option value="g1">고1</option><option value="g2">고2</option><option value="g3">고3</option>
                        </select>
                        <input type="text" id="checkin-name" required placeholder="이름 입력" class="w-full px-4 py-3 text-sm bg-navy-950 border border-indigo-800 rounded-2xl text-slate-100">
                    </div>
                    <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl font-bold">조회하기</button>
                </form>
            </div>
            <div id="student-dashboard" class="hidden space-y-6">
                <div class="bg-navy-900 rounded-3xl border border-indigo-800 p-6 flex justify-between items-center">
                    <div>
                        <h2 class="text-2xl font-black text-white" id="display-student-name"></h2>
                        <button onclick="backToCheckin()" class="text-xs text-slate-400 mt-1"><i class="fa-solid fa-rotate-left"></i> 다른 학생 조회</button>
                    </div>
                </div>
                <div class="bg-navy-900 rounded-3xl border border-indigo-900 p-6" id="student-display-memo"></div>
            </div>
        </div>

        <!-- VIEW 2: TEACHER VIEW -->
        <div id="view-teacher-portal" class="space-y-6">
            <div class="bg-gradient-to-r from-purple-950 via-indigo-950 to-navy-900 rounded-3xl border border-purple-500/40 p-6 shadow-2xl flex flex-col md:flex-row items-center justify-between gap-5">
                <div class="space-y-1">
                    <h3 class="text-xl font-black text-white">오답/패턴 데이터 사진 스캔 & 스마트 음성 즉시 등록</h3>
                    <p class="text-xs text-purple-200/80">사진 스캔 및 음성 마이크로 오답 기록을 등록하세요.</p>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="openImageUploadModal()" class="px-5 py-3 bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs rounded-2xl shadow-xl flex items-center gap-2">
                        <i class="fa-solid fa-camera"></i> 회차 스캔 & 등록
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between bg-navy-900/80 p-3.5 rounded-2xl border border-indigo-900/60 text-xs">
                <div id="cloud-status-badge" class="text-indigo-300">클라우드 연결 중...</div>
                <div class="flex items-center gap-2">
                    <button onclick="forceSyncAllToCloud()" class="px-3 py-1.5 bg-emerald-700 text-white rounded-xl font-bold">강제 동기화</button>
                    <button onclick="exportDataJSON()" class="px-3 py-1.5 bg-navy-950 text-slate-200 rounded-xl font-bold">데이터 백업(JSON)</button>
                    <button onclick="document.getElementById('importFileInput').click()" class="px-3 py-1.5 bg-navy-950 text-slate-200 rounded-xl font-bold">데이터 복원</button>
                    <input type="file" id="importFileInput" accept=".json" onchange="importDataJSON(event)" class="hidden">
                </div>
            </div>

            <div class="bg-navy-900 rounded-3xl border border-indigo-900/60 p-6 shadow-xl space-y-4">
                <h3 class="font-bold text-sm text-white"><i class="fa-solid fa-users text-purple-400"></i> 수강생 누적 오답 데이터 관리</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs text-slate-300 border-collapse">
                        <thead>
                            <tr class="bg-navy-950 text-slate-400 border-b border-indigo-900/80">
                                <th class="p-3 font-bold">학년</th>
                                <th class="p-3 font-bold">학생 이름</th>
                                <th class="p-3 font-bold">응시 횟수</th>
                                <th class="p-3 font-bold">평균 점수</th>
                                <th class="p-3 font-bold text-center">관리 / 리포트 보기</th>
                            </tr>
                        </thead>
                        <tbody id="teacher-student-table-body" class="divide-y divide-indigo-950"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div id="imageUploadModal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center hidden p-4">
        <div class="bg-navy-900 rounded-3xl w-full max-w-xl p-6 space-y-4 border border-purple-500">
            <h3 class="font-bold text-white text-sm">학생 오답 등록 및 수정</h3>
            <input type="text" id="ocr-student-name" placeholder="학생 이름" class="w-full px-3 py-2 bg-navy-950 text-white border border-indigo-800 rounded-xl">
            <select id="ocr-student-grade" class="w-full px-3 py-2 bg-navy-950 text-white border border-indigo-800 rounded-xl">
                <option value="g1">고1</option><option value="g2">고2</option><option value="g3">고3</option>
            </select>
            <textarea id="ocr-memo" rows="3" placeholder="메모 및 처방전" class="w-full px-3 py-2 bg-navy-950 text-white border border-indigo-800 rounded-xl"></textarea>
            <div class="flex justify-end gap-2">
                <button onclick="closeImageUploadModal()" class="px-4 py-2 text-slate-400">취소</button>
                <button onclick="saveOcrResult()" class="px-4 py-2 bg-purple-600 text-white rounded-xl font-bold">저장</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = "seattle_english_student_data_v3";
        window.currentSystemMode = 'teacher';
        window.studentData = [
            { id: 1, name: "리후", grade: "g3", gradeLabel: "고3", memo: "고3 리후 학생", exams: [{ id: 1, title: "10월 학평", score: 83.5, wrongNumbers: [29, 31] }] },
            { id: 2, name: "휘준", grade: "g3", gradeLabel: "고3", memo: "고3 휘준 학생", exams: [{ id: 1, title: "10월 학평", score: 86.7, wrongNumbers: [32, 37] }] },
            { id: 3, name: "동현", grade: "g2", gradeLabel: "고2", memo: "고2 동현 학생", exams: [{ id: 1, title: "10월 학평", score: 80.3, wrongNumbers: [40, 34] }] },
            { id: 4, name: "규민", grade: "g2", gradeLabel: "고2", memo: "가채점 59.5", exams: [{ id: 1, title: "중간고사", score: 59.5, wrongNumbers: [29, 30] }] },
            { id: 5, name: "수현", grade: "g1", gradeLabel: "고1", memo: "1등급 90점", exams: [{ id: 1, title: "10월학평", score: 90, wrongNumbers: [32, 37] }] },
            { id: 6, name: "소연", grade: "g1", gradeLabel: "고1", memo: "고1 소연 학생", exams: [{ id: 1, title: "모의고사", score: 49.3, wrongNumbers: [23, 24] }] },
            { id: 7, name: "태욱", grade: "g1", gradeLabel: "고1", memo: "고1 태욱 학생", exams: [{ id: 1, title: "모의고사", score: 68.0, wrongNumbers: [21, 37] }] },
            { id: 8, name: "나경", grade: "g1", gradeLabel: "고1", memo: "고1 나경 학생", exams: [{ id: 1, title: "모의고사", score: 81.0, wrongNumbers: [29, 30] }] }
        ];

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try { window.studentData = JSON.parse(saved); } catch (e) {}
            } else {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(window.studentData));
            }
        }

        window.saveDataToStorage = function() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(window.studentData));
            window.studentData.forEach(s => {
                if (window.FB_SERVICE && window.FB_SERVICE.saveStudentToCloud) {
                    window.FB_SERVICE.saveStudentToCloud(s);
                }
            });
        };

        window.forceSyncAllToCloud = function() {
            window.saveDataToStorage();
            alert("모든 학생 데이터가 클라우드에 강제 동기화되었습니다!");
        };

        window.onload = function() {
            loadData();
            switchMode('teacher');
        };

        window.switchMode = function(mode) {
            window.currentSystemMode = mode;
            if (mode === 'teacher') {
                document.getElementById('view-teacher-portal').classList.remove('hidden');
                document.getElementById('view-student-portal').classList.add('hidden');
                document.getElementById('btn-mode-teacher').className = "px-3 py-1.5 rounded-xl text-xs font-bold transition bg-purple-600 text-white shadow-md flex items-center gap-1.5";
                document.getElementById('btn-mode-student').className = "px-3 py-1.5 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white flex items-center gap-1.5";
                renderTeacherDashboard();
            } else {
                document.getElementById('view-teacher-portal').classList.add('hidden');
                document.getElementById('view-student-portal').classList.remove('hidden');
                document.getElementById('btn-mode-student').className = "px-3 py-1.5 rounded-xl text-xs font-bold transition bg-indigo-600 text-white shadow-md flex items-center gap-1.5";
                document.getElementById('btn-mode-teacher').className = "px-3 py-1.5 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white flex items-center gap-1.5";
            }
        };

        window.renderTeacherDashboard = function() {
            const tbody = document.getElementById('teacher-student-table-body');
            if (!tbody) return;
            tbody.innerHTML = window.studentData.map(student => `
                <tr class="hover:bg-navy-950/60 transition">
                    <td class="p-3 font-bold text-indigo-300">${student.gradeLabel || student.grade}</td>
                    <td class="p-3 font-bold text-white">${student.name}</td>
                    <td class="p-3 text-slate-300">${(student.exams || []).length}회</td>
                    <td class="p-3 font-extrabold text-emerald-400">${student.exams?.[0]?.score || 0}점</td>
                    <td class="p-3 text-center space-x-1">
                        <button onclick="previewStudentReport('${student.name}', '${student.grade}')" class="px-2.5 py-1.5 bg-indigo-600 text-white rounded-xl font-bold text-[11px]">리포트</button>
                        <button onclick="editStudent(${student.id})" class="px-2.5 py-1.5 bg-purple-600 text-white rounded-xl font-bold text-[11px]">수정</button>
                        <button onclick="deleteStudent(${student.id})" class="px-2.5 py-1.5 bg-rose-900 text-rose-200 rounded-xl font-bold text-[11px]">삭제</button>
                    </td>
                </tr>
            `).join('');
        };

        window.previewStudentReport = function(name, grade) {
            switchMode('student');
            const student = window.studentData.find(s => s.name === name && s.grade === grade);
            if (student) {
                document.getElementById('display-student-name').innerText = `${student.name} 학생 분석 리포트`;
                document.getElementById('student-display-memo').innerText = student.memo || "메모 없음";
            }
        };

        window.backToCheckin = function() {
            switchMode('teacher');
        };

        window.openImageUploadModal = function() {
            document.getElementById('imageUploadModal').classList.remove('hidden');
        };

        window.closeImageUploadModal = function() {
            document.getElementById('imageUploadModal').classList.add('hidden');
        };

        window.saveOcrResult = function() {
            const name = document.getElementById('ocr-student-name').value.trim();
            const grade = document.getElementById('ocr-student-grade').value;
            const memo = document.getElementById('ocr-memo').value.trim();
            if (!name) { alert("이름을 입력하세요."); return; }
            window.studentData.push({ id: Date.now(), name, grade, gradeLabel: grade === 'g1' ? '고1' : grade === 'g2' ? '고2' : '고3', memo, exams: [] });
            saveDataToStorage();
            renderTeacherDashboard();
            closeImageUploadModal();
        };

        window.deleteStudent = function(id) {
            if (confirm("정말 삭제하시겠습니까?")) {
                window.studentData = window.studentData.filter(s => s.id !== id);
                saveDataToStorage();
                renderTeacherDashboard();
                if (window.FB_SERVICE && window.FB_SERVICE.deleteStudentFromCloud) {
                    window.FB_SERVICE.deleteStudentFromCloud(id);
                }
            }
        };

        window.editStudent = function(id) {
            const student = window.studentData.find(s => s.id === id);
            if (!student) return;
            document.getElementById('ocr-student-name').value = student.name;
            document.getElementById('ocr-student-grade').value = student.grade;
            document.getElementById('ocr-memo').value = student.memo || "";
            openImageUploadModal();
        };

        window.exportDataJSON = function() {
            const dataStr = JSON.stringify(window.studentData, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup.json`;
            a.click();
        };

        window.importDataJSON = function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    window.studentData = JSON.parse(evt.target.result);
                    saveDataToStorage();
                    renderTeacherDashboard();
                    alert("복원 완료!");
                } catch (err) { alert("파일 오류"); }
            };
            reader.readAsText(file);
        };
    </script>
</body>
</html>
