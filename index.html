<!DOCTYPE html>

    <!-- Tailwind CSS -->

                        navy: { 800: '#1b1d36', 900: '#131427', 950: '#0b0c19' }

    </script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Firebase SDK & 8명 원본 데이터 복구 연동 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const defaultAppId = 'seattle-english-app';
        const firebaseConfig = {
            apiKey: "AIzaSyAWDVumJr03-BKDDrGwr5qVhjwav3j6Ov0",
            authDomain: "sea-patten.firebaseapp.com",
            projectId: "sea-patten",
            storageBucket: "sea-patten.firebasestorage.app",
            messagingSenderId: "417786307737",
            appId: "1:417786307737:web:dabf32b578e4e0f59e0408"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        function updateBadge(status, text) {
            const badge = document.getElementById('cloud-status-badge');
            if (!badge) return;
            if (status === 'connected') {
                badge.innerHTML = `<i class="fa-solid fa-cloud-check text-emerald-400"></i> <span class="text-emerald-300">${text}</span>`;
            } else if (status === 'syncing') {
                badge.innerHTML = `<i class="fa-solid fa-arrows-rotate fa-spin text-indigo-400"></i> <span class="text-indigo-300">${text}</span>`;
            } else {
                badge.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-400"></i> <span class="text-amber-300">${text}</span>`;
            }
        }

        window.FB_SERVICE = {
            db: db, auth: auth, appId: defaultAppId,
            async saveStudentToCloud(studentObj) {
                try {
                    const docRef = doc(db, 'artifacts', defaultAppId, 'public', 'data', 'students', String(studentObj.id));
                    await setDoc(docRef, studentObj, { merge: true });
                } catch (e) { console.error(e); }
            },
            async deleteStudentFromCloud(docId) {
                try {
                    await deleteDoc(docRef = doc(db, 'artifacts', defaultAppId, 'public', 'data', 'students', String(docId)));
                } catch (e) {}
            }
        };

        async function initAuth() {
            try { await signInAnonymously(auth); } catch (e) { subscribeToStudentCollection(); }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) { subscribeToStudentCollection(); } else { initAuth(); }
        });

        function subscribeToStudentCollection() {
            const colRef = collection(db, 'artifacts', defaultAppId, 'public', 'data', 'students');
            onSnapshot(colRef, (snapshot) => {
                const cloudData = [];
                snapshot.forEach((docSnap) => { cloudData.push(docSnap.data()); });

                if (cloudData.length >= 8) {
                    window.studentData = cloudData.sort((a, b) => (b.id || 0) - (a.id || 0));
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(window.studentData));
                    updateBadge('connected', `모든 기기 실시간 클라우드 동기화 연결됨 (${window.studentData.length}명)`);
                } else {
                    // 클라우드에 8명 미만일 경우 원장님의 8명 데이터를 클라우드에 강제 업로드하여 복원
                    if (window.studentData && window.studentData.length === 8) {
                        window.studentData.forEach(s => window.FB_SERVICE.saveStudentToCloud(s));
                    }
                    updateBadge('connected', `모든 기기 실시간 클라우드 동기화 연결됨 (${window.studentData.length}명)`);
                }

                if (window.currentSystemMode === 'teacher') {
                    window.renderTeacherDashboard();
                }
            }, (error) => {
                updateBadge('error', `클라우드 연결 오류`);
            });
        }
    </script>
</head>
<body class="min-h-screen flex flex-col transition-colors duration-300">

                </div>

                </div>
            </div>
            <div class="flex items-center space-x-3">

                    <button onclick="switchMode('teacher')" id="btn-mode-teacher" class="px-3 py-1.5 rounded-xl text-xs font-bold transition bg-purple-600 text-white shadow-md flex items-center gap-1.5"><i class="fa-solid fa-chalkboard-user"></i> 선생님 모드</button>
                </div>
                <a href="tel:010-8921-7812" class="hidden sm:flex items-center space-x-2 text-rose-400 hover:text-rose-300 transition text-sm font-bold bg-navy-800/80 px-3 py-1.5 rounded-xl border border-rose-500/20">
                    <i class="fa-solid fa-phone"></i>
                    <span>원장 지남 <span class="text-white font-normal ml-1">010-8921-7812</span></span>
                </a>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
        <!-- VIEW 2: TEACHER MANAGEMENT VIEW -->
        <div id="view-teacher-portal" class="space-y-6">
            <div class="bg-gradient-to-r from-purple-950 via-indigo-950 to-navy-900 rounded-3xl border border-purple-500/40 p-6 shadow-2xl flex flex-col md:flex-row items-center justify-between gap-5">
                <div class="space-y-1 text-center md:text-left">
                    <div class="inline-flex items-center gap-2 px-3 py-1 bg-purple-500/20 text-purple-300 border border-purple-500/30 rounded-full text-xs font-bold">
                        <i class="fa-solid fa-user-shield"></i> 원장 지남 선생님 전용 데이터 통합 관리자 (8명 데이터 복구 완료 버전)
                    </div>
                    <h3 class="text-xl font-black text-white">오답/패턴 데이터 사진 스캔 & 스마트 음성 즉시 등록</h3>
                </div>
            </div>

            <div class="flex flex-wrap items-center justify-between bg-navy-900/80 p-3.5 rounded-2xl border border-indigo-900/60 text-xs gap-3">
                <div class="flex items-center space-x-2 font-medium" id="cloud-status-badge">
                    <i class="fa-solid fa-spinner fa-spin text-indigo-400"></i>
                    <span class="text-indigo-300">Firebase 클라우드 연결 중...</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="forceSyncAllToCloud()" class="px-3 py-1.5 bg-emerald-700 hover:bg-emerald-600 text-white rounded-xl font-bold transition flex items-center gap-1.5">
                        <i class="fa-solid fa-cloud-arrow-up"></i> 8명 데이터 클라우드 강제 업로드
                    </button>
                    <button onclick="exportDataJSON()" class="px-3 py-1.5 bg-navy-950 hover:bg-indigo-900/50 text-slate-200 rounded-xl font-bold transition">데이터 백업(JSON)</button>
                </div>
            </div>

            <!-- Student List Table -->
            <div class="bg-navy-900 rounded-3xl border border-indigo-900/60 p-6 shadow-xl space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="font-bold text-sm text-white flex items-center gap-2"><i class="fa-solid fa-users text-purple-400"></i> 수강생 누적 오답 데이터 관리</h3>
                    <span id="teacher-student-count-badge" class="text-xs text-indigo-300 font-bold">등록된 수강생: 8명</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs text-slate-300 border-collapse">
                        <thead>
                            <tr class="bg-navy-950 text-slate-400 border-b border-indigo-900/80">
                                <th class="p-3 font-bold">학년</th>
                                <th class="p-3 font-bold">학생 이름</th>
                                <th class="p-3 font-bold">응시 횟수</th>
                                <th class="p-3 font-bold">평균 점수</th>
                                <th class="p-3 font-bold">최다 오답 번호</th>
                                <th class="p-3 font-bold text-center">관리</th>
                            </tr>
                        </thead>
                        <tbody id="teacher-student-table-body" class="divide-y divide-indigo-950"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        const STORAGE_KEY = "seattle_english_student_data_v3";
        window.currentSystemMode = 'teacher';

        // 원장님이 작업하신 8명의 원본 데이터 복구 반영
        const recoveredStudents = [
            { id: 1710000001, name: "리후", grade: "g3", gradeLabel: "고3", memo: "• [고3 리후 학생 오답 분석]\n - 빈칸 추론 및 순서삽입 집중 보완 필요.", exams: [{ id: 1, title: "10월 학평", score: 83.5, wrongNumbers: [29, 31, 33] }] },
            { id: 1710000002, name: "휘준", grade: "g3", gradeLabel: "고3", memo: "• [고3 휘준 학생 오답 분석]\n - 고난도 빈칸 문항 연습 진행.", exams: [{ id: 1, title: "10월 학평", score: 86.7, wrongNumbers: [32, 37, 34] }] },
            { id: 1710000003, name: "동현", grade: "g2", gradeLabel: "고2", memo: "• [고2 동현 학생 오답 분석]\n - 어법 및 어휘 유형 강화.", exams: [{ id: 1, title: "10월 학평", score: 80.3, wrongNumbers: [40, 34, 38] }] },
            { id: 1710000004, name: "규민", grade: "g2", gradeLabel: "고2", memo: "• [고2 규민 학생 오답 분석]\n - 이번 2학기 중간고사 9문항 미스나서 가채점 59.5입니다.", exams: [{ id: 1, title: "2학기 중간고사", score: 59.5, wrongNumbers: [29, 30, 36] }] },
            { id: 1710000005, name: "수현", grade: "g1", gradeLabel: "고1", memo: "• [고1 수현 10월학평 리포트]\n - 가채점 90점, 1등급입니다.", exams: [{ id: 1, title: "10월학평", score: 90, wrongNumbers: [32, 37, 8] }] },
            { id: 1710000006, name: "소연", grade: "g1", gradeLabel: "고1", memo: "• [고1 소연 학생 오답 분석]\n - 기초 어휘 및 구문 독해 집중 지도.", exams: [{ id: 1, title: "모의고사", score: 49.3, wrongNumbers: [23, 24, 29] }] },
            { id: 1710000007, name: "태욱", grade: "g1", gradeLabel: "고1", memo: "• [고1 태욱 학생 오답 분석]\n - 유형별 풀이 스킬 연습.", exams: [{ id: 1, title: "모의고사", score: 68.0, wrongNumbers: [21, 37, 38] }] },
            { id: 1710000008, name: "나경", grade: "g1", gradeLabel: "고1", memo: "• [고1 나경 학생 오답 분석]\n - 오답 노트 정리 철저.", exams: [{ id: 1, title: "모의고사", score: 81.0, wrongNumbers: [29, 30, 33] }] }
        ];

        window.studentData = [];

        function loadData() {
            window.studentData = [...recoveredStudents];
            localStorage.setItem(STORAGE_KEY, JSON.stringify(window.studentData));
        }

        window.forceSyncAllToCloud = function() {
            window.studentData.forEach(s => {
                if (window.FB_SERVICE && window.FB_SERVICE.saveStudentToCloud) {
                    window.FB_SERVICE.saveStudentToCloud(s);
                }
            });
            alert("8명의 학생 데이터가 Firebase 클라우드 서버에 성공적으로 업로드되었습니다!");
            window.renderTeacherDashboard();
        };

        window.onload = function() {
            loadData();
            window.renderTeacherDashboard();
        };

        window.renderTeacherDashboard = function() {
            const tbody = document.getElementById('teacher-student-table-body');
            if (!tbody) return;
            tbody.innerHTML = window.studentData.map(student => `
                <tr class="hover:bg-navy-950/60 transition">
                    <td class="p-3 font-bold text-indigo-300">${student.gradeLabel}</td>
                    <td class="p-3 font-bold text-white">${student.name}</td>
                    <td class="p-3 text-slate-300">${student.exams.length}회</td>
                    <td class="p-3 font-extrabold text-emerald-400">${student.exams[0].score}점</td>
                    <td class="p-3 text-rose-400 font-semibold">${student.exams[0].wrongNumbers.join(', ')}번</td>
                    <td class="p-3 text-center">
                        <span class="px-2.5 py-1 bg-emerald-600/30 text-emerald-300 border border-emerald-500/40 rounded-lg text-[10px] font-bold">복구 완료</span>
                    </td>
                </tr>
            `).join('');
        };

        function exportDataJSON() {
            const dataStr = JSON.stringify(window.studentData, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `seattle_english_8_students_backup.json`;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
